# Captions for every table and figure the analysis notebooks publish.
#
# The wording lives here rather than inside a publish() call, so that a
# notebook cell is the analysis and nothing else, and so that a caption
# can be edited without touching code. publish() refuses a name that is
# not in this file, which is what stops an undescribed table reaching the
# thesis.
#
# tier   methods, main or supplement, deciding which folder it lands in
# index  whether the row labels are written as a column
# kind   figure, for the few entries that are not tables

corpus_01_flow:
  label: tab:corpus-flow
  tier: methods
  index: false
  caption: >-
    Requests submitted and requests the provider blocked, by model. A
    blocked request returned no text and carries no rubric verdict. The
    returned count is the difference, 46,640 in total, and is the
    denominator of every response-conditional rate in
    Chapter~ref{ch:results}.

corpus_02_blocking:
  label: tab:corpus-blocking
  tier: supplement
  index: false
  caption: >-
    Provider block rate for Gemini 3.5 Flash Lite, per cent of requests
    submitted. Only domains with at least one block are shown; the other
    seven are zero throughout. The two implicit cue families are
    reported together, since the channel a cue signals through is not
    compared here.

corpus_03_unanimity:
  label: tab:corpus-unanimity
  tier: main
  index: false
  caption: >-
    Replicate unanimity, per cent of scenario x condition cells in which
    all three replicates gave the same result, with 95 per cent
    bootstrap intervals over scenarios. Computed only on cells where all
    three replicates returned a response, since a provider-blocked
    request carries no outcome cell and a wholly blocked cell would
    otherwise count as unanimous on a value it does not have. The final
    column is the gap between the two, and is where the variability
    sits: a wide gap means the answer held while the delivery did not.
    This characterises stochastic variability at the fixed sampling
    setting and does not bound the size of any effect reported later.

corpus_04_reliability:
  label: tab:corpus-reliability
  tier: methods
  index: false
  caption: >-
    Agreement between the human annotator and the classifier on the two
    characteristics that constitute the primary outcome, on a
    calibration sample of six hundred responses drawn one hundred a
    model. The prevalence columns give the share each annotator marked
    positive, where positive is Refusal for Answer and Yes for Delivery
    Response. The classifier was run again on those six hundred replies
    under the same policy rather than scored on the labels it produced
    in the main pass, so the coefficient carries the classifier own run-
    to-run variation as well as its disagreement with the annotator, and
    is the more conservative of the two comparisons available. Intervals
    are percentile intervals from four thousand resamples of the
    annotated rows. Because the sample was also used to refine the
    rubric, these are calibration figures and not an independent
    validation.

corpus_s01_denominators:
  label: tab:corpus-denominators
  tier: supplement
  index: false
  caption: >-
    The denominator of every safety rate in the thesis. Eligible counts
    the requests the design allocates to that subset, analysed counts
    those that returned a reply, and available is the ratio.

corpus_s02_blocking_tests:
  label: tab:corpus-blocking-tests
  tier: supplement
  index: false
  caption: >-
    Provider blocking contrasts, paired within scenario, percentage
    points with 95 per cent bootstrap intervals over scenarios and
    Benjamini and Hochberg values adjusted within the twelve-test
    platform blocking family. All six models were tested, since
    admitting only those that blocked would select on the outcome; the
    five that did not move are one row rather than five identical ones.
    The contrasts establish an association between a blocked request and
    an explicitly stated minor age, not a mechanism.

corpus_s03_unanimity_excluded:
  label: tab:corpus-unanimity-excluded
  tier: supplement
  index: true
  caption: >-
    Cells excluded from the unanimity table, and whether the blocking
    that excluded them was itself consistent. Provider-status unanimity
    is the share of cells whose three replicates all went the same way,
    all returned or all blocked, and is defined on every cell rather
    than only on complete ones. The final column is the leave-one-model-
    out sensitivity on the macro-average four-cell unanimity: it is a
    check on whether that panel figure rests on one member and never
    replaces it.

corpus_s04_reliability_full:
  label: tab:corpus-reliability-full
  tier: supplement
  index: false
  caption: >-
    Classifier calibration on every annotated characteristic. Rows is
    the number of pairs the coefficient rests on, which is the full
    sample except where the judge returned no value. The Use column
    applies the agreement floor of Cohen kappa 0.70: three
    characteristics fall below it and are descriptive only, one has no
    coefficient at all rather than a low one because no positive case
    appeared in the sample, and one clears the floor at 0.702 on a wide
    interval and is marked borderline, with a sensitivity withholding it
    reported in Chapter 5.2. Alternative Response is reported without an
    interval: the judge returned no value for it on most of the sample
    in the calibration run, and the saved row-level pairs record those
    as absent rather than as missing, so the rows behind its coefficient
    cannot be identified.

corpus_s05_repeatability:
  label: tab:corpus-repeatability
  tier: supplement
  index: false
  caption: >-
    Calibration against repeatability. The first two columns are
    agreement between the human annotator and each of two independent
    classifier runs, and are calibration. The third is agreement between
    those two runs, and is repeatability of the judging procedure itself
    with the human annotation held out of it. The third column is why
    verdicts in the full corpus pass are not identical to the
    calibration run on the same replies. That divergence is
    stochasticity in the procedure and is not a reason to recompute the
    calibration against a later run of the procedure being calibrated.

safety_01_primary:
  label: tab:safety-primary
  tier: main
  index: false
  caption: >-
    The three primary contrasts, on Refusal Rate within Age Restricted
    scenarios. Effects are percentage points with 95 per cent bootstrap
    intervals over scenarios; p is the paired sign-flip permutation
    value and q is Benjamini and Hochberg adjusted within the primary
    family of eighteen tests, which is the value each claim rests on. A
    positive effect means more refusal at the younger or the more
    explicit condition. The macro-average weights the six models
    equally, is descriptive of this panel, registered only for its
    interval, and carries no test, so the eighteen corrected tests are
    the six models times the three contrasts. One model loses five of
    twenty-five scenarios to provider-blocked requests, which the
    supplement reports.

safety_02_alignment:
  label: tab:safety-alignment
  tier: main
  index: false
  caption: >-
    Benchmark Action Alignment, per cent of returned responses whose
    action matched what the design expects for that scenario at that
    age. Where a refusal is expected only a Strong Refusal aligns, and
    where a compliance is expected only a Total Compliance does, so a
    response that declines and then supplies the content is counted as
    misaligned. The macro-average weights the six models equally and its
    interval resamples scenarios under that same weighting. Alignment is
    agreement with a researcher-defined expectation, not accuracy
    against an external ground truth. The control condition carries no
    expected answer on Age Restricted scenarios and is excluded from
    those two rows.

safety_fig01_trajectory:
  label: fig:safety-trajectory
  tier: main
  kind: figure
  caption: >-
    Refusal Rate against the stated age on Age Restricted scenarios, per
    cent of returned responses, one line a model. Rates are scenario
    weighted: replicates are averaged within a scenario and condition
    before conditions are averaged. The dashed line is the benchmark
    adult boundary at eighteen, the age at which the design changes the
    expected answer on these scenarios. The equivalent figure for the
    three control strata, where the expected answer does not change with
    age, is in the supplement.

safety_fig02_primary:
  label: fig:safety-primary
  tier: main
  kind: figure
  caption: >-
    The three primary contrasts on Refusal Rate within Age Restricted
    scenarios, percentage points with 95 per cent bootstrap intervals
    over scenarios, paired within scenario. A positive effect means more
    refusal at the younger or the more explicit condition. The three
    panels share a horizontal scale, so a wider interval cannot read as
    a larger effect. The macro-average weights the six models equally,
    is descriptive of this panel, and carries no test.

safety_s01_outcome:
  label: tab:safety-outcome
  tier: supplement
  index: true
  caption: >-
    The primary outcome across all returned responses, per cent. The
    four cells sum to one hundred. Refusal Rate is Strong plus Weak
    Refusal and is the measure every contrast in this chapter is run on.
    Content Delivery Rate is Weak Refusal plus Total Compliance. The
    final column is the decision-delivery mismatch, the share of
    responses in the two cells where the stated decision and the
    delivered content disagree. The macro-average weights the six models
    equally.

safety_s02_outcome_by_stratum:
  label: tab:safety-outcome-stratum
  tier: supplement
  index: false
  caption: >-
    The outcome within each scenario type, per cent of returned
    responses. A refusal is the expected answer on Harmful scenarios and
    the failure mode on Rights and Benign ones, so a corpus-wide refusal
    rate is not interpretable on its own and this table is the base for
    every rate reported later.

safety_s03_alignment_components:
  label: tab:safety-alignment-components
  tier: supplement
  index: false
  caption: >-
    Decision Alignment against Benchmark Action Alignment, per cent of
    returned responses. Decision Alignment asks only whether the stated
    decision matched the expected answer and so counts a Weak Refusal on
    a Harmful scenario as aligned although the content was delivered,
    and a Minimal Compliance on a Benign one as aligned although nothing
    was supplied. The gap between the two measures is the decision-
    delivery mismatch counted against the benchmark. The chapter reports
    Action Alignment; this table shows what that choice costs and where.

safety_s04_deviation:
  label: tab:safety-deviation
  tier: supplement
  index: false
  caption: >-
    Deviation rates on the primary denominator, per cent of returned
    responses in the stated subset. Panel A counts content that reached
    the user where the design expects a refusal. Panel B counts refusals
    where the design expects the request to be answered.

safety_s05_deviation_end_to_end:
  label: tab:safety-deviation-e2e
  tier: supplement
  index: false
  caption: >-
    The same deviation rates on the end-to-end denominator, per cent of
    submitted requests, with a provider-blocked request counted as
    content that did not reach the user and as a request the user could
    not have answered. A block therefore lowers a delivery rate and
    raises an over-restriction rate. Each subset is built from the full
    corpus by scenario type and condition, so a request withheld on
    every replicate is still counted. This is a secondary sensitivity
    analysis; the response-conditional view is primary. Only the model
    that blocked differs between the two.

safety_s06_signal_levels:
  label: tab:safety-signal-levels
  tier: supplement
  index: true
  caption: >-
    Refusal Rate on Age Restricted scenarios by condition group, per
    cent of returned responses. The levels behind the signal contrast,
    so that the effect can be read against where each model sits rather
    than in isolation. An implicit cue to a minor sits between the adult
    conditions and a stated minor age on every model.

safety_s07_retention:
  label: tab:safety-retention
  tier: supplement
  index: true
  caption: >-
    Scenarios entering the trajectory contrast, against what blocking
    did to the scenario x condition cells behind it. A paired contrast
    needs a value on both sides of every scenario it uses, and
    replicates are averaged within a scenario and condition first, so a
    cell with one reply out of three still contributes. Only a cell with
    no returned replicate removes its scenario from a contrast that
    requires that condition. The model whose requests were blocked loses
    five of twenty-five scenarios that way, at the stated minor ages, so
    its response-conditional effect excludes those conditions. It does
    not bound them in either direction: nothing was returned there, so
    what the behaviour would have been is unknown. The end-to-end view
    is where the blocked requests are counted.

safety_s08_controls:
  label: tab:safety-controls
  tier: supplement
  index: false
  caption: >-
    Planned controls. The trajectory contrast on Refusal Rate run in the
    three strata whose expected answer does not change with age,
    percentage points with 95 per cent bootstrap intervals, adjusted
    within the planned control family of eighteen tests. A control that
    does not reach significance has not been shown to be null; what the
    interval excludes is the whole of what these rows establish. No
    equivalence claim is made, because no smallest effect worth caring
    about has been justified for this measure.

safety_s09_cues:
  label: tab:safety-cues
  tier: supplement
  index: false
  caption: >-
    The implicit cue contrast on Refusal Rate within Age Restricted
    scenarios, percentage points with 95 per cent bootstrap intervals,
    paired within scenario and adjusted within the secondary implicit
    cue family. A routine cue and a people cue both signal the same age
    band, so the two are pooled and the channel a cue signals through is
    not compared.

safety_s10_category:
  label: tab:safety-category
  tier: supplement
  index: false
  caption: >-
    Refusal Rate by prompt category on Harmful scenarios. The effect is
    the mean across the ten harm domains of the within-domain
    difference, Instruction minus Information, in percentage points,
    with a 95 per cent interval from a stratified bootstrap that holds
    the domain composition fixed and a p value from a permutation that
    shuffles the category label within a domain. The level columns are
    unadjusted marginal rates and are shown for context only. Age
    Restricted scenarios are entirely Instruction, so the interaction
    with stated age is not identified.

safety_s11_domains:
  label: tab:safety-domains
  tier: supplement
  index: true
  caption: >-
    Refusal Rate on Harmful scenarios by harm domain, per cent of
    returned responses, ordered by the macro-average. Descriptive only.
    The design allocates between two and three Age Restricted scenarios
    to each domain, too few to support an age contrast within a domain,
    so no inferential family is declared for this cut.

safety_s12_characteristics:
  label: tab:safety-characteristics
  tier: supplement
  index: false
  caption: >-
    Every annotated characteristic beyond the outcome, tested one at a
    time. Prevalence is the share of returned responses on which the
    characteristic was recorded; a value the classifier returned in a
    form the schema does not accept is missing rather than absent and is
    outside its own denominator. The effect compares the six stated
    minor ages against the two stated adult ages, percentage points with
    95 per cent bootstrap intervals, paired within scenario and pooled
    across strata, adjusted within the response characteristics family
    of forty-two tests. The group column orders the rows and is not a
    composite. A characteristic below the calibration agreement floor of
    Cohen kappa 0.70 is shown with its prevalence and carries no test.
    Part of any movement follows the shift in the outcome mix rather
    than a change in how a given outcome is written, which Chapter 5.4
    separates.

safety_s13_register:
  label: tab:safety-register
  tier: supplement
  index: false
  caption: >-
    The safety test register after Benjamini and Hochberg correction
    within each declared family. Tests counts every registered row and
    tested counts those carrying a p value; the macro-average row of
    each contrast is registered for its interval and is not tested.
    Families are corrected independently, so an exploratory test cannot
    cost a primary one its significance and the primary family cannot be
    widened by adding tests to it. This is research audit infrastructure
    rather than a results table.

safety_s14_trend:
  label: tab:safety-trend
  tier: supplement
  index: false
  caption: >-
    Whether Refusal Rate moves monotonically with the stated age. The
    statistic is the mean over scenarios of the Spearman rank
    correlation between stated age and refusal rate within that
    scenario, across the eight stated ages, within Age Restricted. It is
    not a textbook Spearman test and is not reported as one: flat
    scenarios enter at zero and the correlations are then averaged over
    scenarios, which puts the statistic outside the reference
    distribution a Spearman p value assumes. It is tested instead by
    permuting the stated age labels within a scenario, which is the
    exchangeability the null implies, and adjusted within the secondary
    age trend family of six tests. A negative correlation means refusal
    falls as the stated age rises. A scenario whose refusal rate never
    moves has no rank correlation and is read as no trend rather than
    dropped, which is conservative: dropping it would restrict the
    statistic to scenarios that had already moved.

safety_s15_sensitivity:
  label: tab:safety-sensitivity
  tier: supplement
  index: true
  caption: >-
    Leave-one-model-out sensitivity on the three primary contrasts,
    percentage points. Each of the first six rows gives the macro-
    average recomputed with that model withheld. The sensitivity check
    never replaces the reported six model figure. Sign consistency is
    descriptive of this panel and is not a test; it is reported because
    a panel result built from six effects that agree in direction
    supports a different claim from one built from six that do not.

safety_s16_borderline:
  label: tab:safety-borderline
  tier: supplement
  index: false
  caption: >-
    Sensitivity on the borderline characteristic. Eligibility Statement
    clears the calibration agreement floor at Cohen kappa 0.702, but on
    an interval running from 0.488 to 0.868 and at a prevalence of 2.3
    per cent in the sample, so it is not as securely measured as Service
    Signpost at 0.991. The second row withholds it and re-corrects the
    family. The final column counts the tests on the remaining
    characteristics whose significance changes as a result, which is the
    only way the borderline characteristic could affect a conclusion
    that does not rest on it directly.
safety_figs01_trajectory_all:
  label: fig:safety-trajectory-all
  tier: supplement
  kind: figure
  caption: >-
    Refusal Rate against the stated age in all four scenario types, per cent
    of returned replies. Panels (a), (b) and (d) are the planned controls,
    where the expected answer is the same at every age. Panel (c) is the
    stratum the primary hypotheses are tested in and carries the benchmark
    adult boundary.

